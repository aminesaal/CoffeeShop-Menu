<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>Dzair CAFE</h1>
        <p class="established">Est. 2026</p>
        <hr>
        <section>
          <h2>Coffee</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">French Vanilla</p><p class="price">300 da</p>
          </article>
          <article class="item">
            <p class="flavor">Caramel Macchiato</p><p class="price">375 da</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">350 da</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">400 da</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p><p class="price">450 da</p>
          </article>
        </section>
        <section>
          <h2>Desserts</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Donut</p><p class="price">150 da</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">275 da</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p><p class="price">300 da</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">250 da</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="https://www.instagram.com/_amine.u/" target="_blank">Visit our instagram</a>
          </p>
          <p class="address">123 Viva Algerie</p>
        </address>
      </footer>
    </div>
  </body>
</html>
